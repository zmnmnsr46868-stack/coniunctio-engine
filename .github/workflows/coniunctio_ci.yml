name: Coniunctio Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run Core Test Suite
      run: |
        python test_coniunctio.py

    - name: Run v0.6 Adaptive Simulation Telemetry
      run: |
        python run_simulation_v06.py
