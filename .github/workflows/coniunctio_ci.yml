name: Coniunctio CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
            - run: pip install pytest
      - run: python test_coniunctio.py
      - run: pytest -q
      - run: python run_simulation_v06.py
      - run: |
          if ls trajectory_*.json 1> /dev/null 2>&1; then
            python analyzer.py
          else
            echo "No trajectory file exported; skipping analyzer."
          fi
