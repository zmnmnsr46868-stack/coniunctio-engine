name: Coniunctio Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project & Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run Core Test Suite
        run: |
          python test_coniunctio.py

      - name: Run v0.6 Adaptive Simulation Telemetry
        run: |
          python run_simulation_v06.py

      - name: Run Comparative Benchmark Regression Guard
        run: |
          python run_benchmark.py

      - name: Upload Simulation & Benchmark Artifacts
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coniunctio-telemetry-py${{ matrix.python-version }}
          path: |
            *.json
            *.log
            *.csv
          if-no-files-found: ignore
