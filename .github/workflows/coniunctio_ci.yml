name: Coniunctio CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python test_coniunctio.py
      - run: pytest -q
      - name: Run PreservationSeed tests
        run: python preservation_seed_v2.py test -v
      - run: python run_simulation_v06.py
      - name: Run Trajectory Analyzer & Publish Summary
        run: |
          if ls trajectory_*.json 1> /dev/null 2>&1; then
            echo "### Coniunctio Trajectory Analysis" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            python analyzer.py | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No trajectory file exported; skipping analyzer."
          fi
      - name: Upload Trajectory JSON Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-logs
          path: trajectory_*.json
          retention-days: 30
